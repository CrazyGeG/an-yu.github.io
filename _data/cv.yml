    Experience:
      - company: CVS Health, Rx Personalization Team
        position: Machine Learning Engineering Graduate Intern
        location: USA, Connecticut
        start_date: 2026-05
        end_date: 2026-08
        highlights:
          - "Built and operationalized machine learning workflows for CVS's Rx Personalization Team, including model training, registration, deployment, and pipeline orchestration on Databricks and Google Cloud Platform (GCP); supported the migration of production models from Databricks to GCP."
          - "Designed and developed reusable skills, hooks, and an AI-agent memory stack, enabling teams to build more efficient and consistent Claude-powered workflows."

      - company: Regeneron, Process Science Lab
        position: Data Scientist Intern
        location: USA, New York
        start_date: 2025-05
        end_date: 2025-08
        highlights:
          - "Developed and deployed computer-vision pipelines leveraging Vision-Language Model (VLM) architectures to analyze high-resolution cellular imagery and extract quantitative morphological and contextual features."
          - "Designed automated inference and post-processing workflows integrating image embeddings with structured laboratory data, improving throughput and reproducibility."
          - "Reduced expert review time from several hours to minutes by replacing manual visual inspection with scalable, model-driven analysis tools."

      - company: Regeneron, Process Science Lab
        position: Data Scientist Intern
        location: USA, New York
        start_date: 2024-05
        end_date: 2024-12
        highlights:
          - "Created visual representations of the metabolic network using Python libraries such as matplotlib, Escher and Cobrapy."
          - "Implemented dimension reduction techniques such as SVD, PCA, and UMAP on the stoichiometric matrix, and utilized Truncated SVD for reconstructing metabolic networks in iCHOv1, iCHO2991, iCHO2441 and all other existing 8 CHO models."
          - "Examined the streamlined model with the goal of boosting PS Labs' capacity for better process comprehension for fostering alignment."

      - company: Office of Mental Health, New York State Office
        position: Research Scientist Intern
        location: USA, New York
        start_date: 2023-04
        end_date: 2023-08
        highlights:
          - "Conducted comprehensive data retrieval for mental health patient records from the database employing SQL, ensuring accurate and efficient data extraction for analysis."
          - "Engaged in advanced data pre-processing and feature selection techniques, leveraging Mutual Information and Chi-Square tests to identify the most relevant predictors for mental health assessments."
          - "Led the creation and deployment of a high-accuracy (95%) predictive model utilizing XGBoost, designed to pinpoint individuals at an increased risk of mental health problems, thereby bolstering the office's ability to proactively intervene."
    Awards:
      - date: 2026
        awarder: John J. Sullivan Award from the College of Nanotechnology, Science, and Engineering, University at Albany - SUNY

    Professional Activities:
      - label: Reviewer
        details: IJCV, ICIP, AICity, CVPR, AAAI, ECCV, NeurIPS, IEEE TMM

